name: Gas Docs Drift

# Keeps the figures on docs.x402r.org/contracts/gas-costs honest. Re-runs the
# docs-cited GasBenchmark.t.sol, compares against a committed baseline, and
# opens a tracking issue when the numbers drift past threshold so the docs page
# (and its pinned commit) can be refreshed. On main it also refreshes the
# baseline so the next drift is measured from current.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/gas/**'
      - 'foundry.toml'

permissions:
  contents: write
  issues: write

jobs:
  benchmark-drift:
    name: Benchmark drift vs docs baseline
    runs-on: ubuntu-latest
    env:
      # Cross-repo PAT (repo scope on BackTrackCo/docs). When set, drift opens a
      # docs PR; when absent, it falls back to a tracking issue here.
      DOCS_PR_TOKEN: ${{ secrets.DOCS_PR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Snapshot docs benchmark
        run: |
          forge snapshot --match-contract GasBenchmark --snap test/gas/.docs-gas-benchmark.new
          cat test/gas/.docs-gas-benchmark.new

      - name: Compare against committed baseline
        id: drift
        run: |
          baseline=test/gas/.docs-gas-benchmark
          current=test/gas/.docs-gas-benchmark.new
          if [ ! -f "$baseline" ]; then
            echo "No baseline committed yet, seeding it."
            echo "state=seed" >> "$GITHUB_OUTPUT"
          elif diff -u "$baseline" "$current" > test/gas/benchmark-drift.txt; then
            echo "No drift."
            echo "state=clean" >> "$GITHUB_OUTPUT"
          else
            echo "Drift detected:"
            cat test/gas/benchmark-drift.txt
            echo "state=drift" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh committed baseline (main only)
        if: github.ref == 'refs/heads/main' && steps.drift.outputs.state != 'clean'
        run: |
          mv test/gas/.docs-gas-benchmark.new test/gas/.docs-gas-benchmark
          if [ -n "$(git status --porcelain test/gas/.docs-gas-benchmark)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add test/gas/.docs-gas-benchmark
            git commit -m "chore(gas): refresh docs benchmark baseline [skip ci]"
            git push
          fi

      - name: Open or update docs PR (cross-repo)
        if: steps.drift.outputs.state == 'drift' && env.DOCS_PR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DOCS_PR_TOKEN }}
          DOCS_REPO: BackTrackCo/docs
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${HEAD_SHA:0:7}"
          TODAY="$(date -u +%F)"

          # Fresh report surfaced in the PR body for the reviewer to transcribe.
          forge test --match-path test/gas/GasBenchmark.t.sol --gas-report > /tmp/gas-report.txt 2>&1 || true

          BRANCH="automated/gas-costs-refresh"

          git clone --depth 1 "https://x-access-token:${DOCS_PR_TOKEN}@github.com/${DOCS_REPO}.git" /tmp/docs
          cd /tmp/docs

          # Leave an in-progress refresh PR alone, do not clobber human transcription.
          if gh pr view "$BRANCH" --repo "$DOCS_REPO" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "A gas-costs refresh PR is already open; leaving it for human follow-up."
            exit 0
          fi

          git checkout -B "$BRANCH"

          f=contracts/gas-costs.mdx
          OLD_SHA="$(grep -oE '[0-9a-f]{40}' "$f" | head -1 || true)"
          if [ -n "$OLD_SHA" ]; then
            OLD_SHORT="${OLD_SHA:0:7}"
            sed -i "s/${OLD_SHA}/${HEAD_SHA}/g" "$f"
            sed -i "s/${OLD_SHORT}/${SHORT}/g" "$f"
          fi
          # Bump the snapshot date stamp (snapshot: YYYY-MM-DD).
          sed -i -E "s/snapshot: [0-9]{4}-[0-9]{2}-[0-9]{2}/snapshot: ${TODAY}/g" "$f"

          if git diff --quiet; then
            echo "No textual change to gas-costs.mdx (pin already current); skipping PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "docs(gas): bump pinned benchmark to ${SHORT} (${TODAY})"
          git push -f -u origin "$BRANCH"

          # shellcheck disable=SC2129
          {
            echo "Automated by the \`gas-docs-drift\` workflow in x402r-contracts: \`GasBenchmark.t.sol\` drifted from the committed baseline at \`${SHORT}\`."
            echo
            echo "This PR bumps the pinned benchmark commit and snapshot date. **Draft until a human transcribes the updated figures into the tables** using the fresh report below, the workflow does not auto-edit hand-curated table cells."
            echo
            echo "- [ ] Update headline and per-operation gas figures in \`contracts/gas-costs.mdx\`"
            echo "- [ ] Confirm the cost-in-dollars cells still hold at the current Base gas price"
            echo "- [ ] Mark ready for review"
            echo
            echo "<details><summary>Fresh forge test --gas-report</summary>"
            echo
            echo '```'
            cat /tmp/gas-report.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Head: \`${HEAD_SHA}\`"
          } > /tmp/pr-body.md

          gh pr create --repo "$DOCS_REPO" --base main --head "$BRANCH" --draft \
            --title "docs(gas): refresh gas-costs benchmark (${SHORT})" \
            --body-file /tmp/pr-body.md

      - name: Open or update docs-drift issue
        if: steps.drift.outputs.state == 'drift' && env.DOCS_PR_TOKEN == ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.existsSync('test/gas/benchmark-drift.txt')
              ? fs.readFileSync('test/gas/benchmark-drift.txt', 'utf8')
              : '(diff unavailable)';
            const marker = '<!-- gas-docs-drift -->';
            const sha = context.sha;
            const body = [
              marker,
              '`GasBenchmark.t.sol` has drifted from the committed docs baseline.',
              '',
              'The figures on **docs.x402r.org/contracts/gas-costs** are pinned to a commit and quote exact numbers. Regenerate the page and bump the pinned commit:',
              '',
              '```bash',
              `git checkout ${sha}`,
              'forge test --match-path test/gas/GasBenchmark.t.sol -vv',
              '```',
              '',
              `Current head: \`${sha}\``,
              '',
              '<details><summary>Benchmark diff</summary>',
              '',
              '```diff',
              diff.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'documentation',
              per_page: 100,
            });
            const hit = existing.data.find(i => (i.body || '').includes(marker));
            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Gas costs drifted, refresh docs gas-costs page',
                labels: ['documentation'],
                body,
              });
            }

      - name: Upload benchmark snapshot
        uses: actions/upload-artifact@v4
        with:
          name: docs-gas-benchmark-${{ github.run_number }}
          path: |
            test/gas/.docs-gas-benchmark.new
            test/gas/benchmark-drift.txt
          retention-days: 90
          if-no-files-found: ignore
